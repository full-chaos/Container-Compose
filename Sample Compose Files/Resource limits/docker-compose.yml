# Demonstrates resource limits via top-level Service properties (Phase 2B).
# These are the new top-level fields from Phase 1.2 (parsed) wired through
# ResourceArgs in Phase 2B. They override deploy.resources.limits when present.

services:
  trainer:
    image: alpine:latest
    command: ["sh", "-c", "yes > /dev/null"]   # CPU-bound dummy workload
    cpus: 1.5
    cpu_shares: 1024
    cpuset: "0-3"
    mem_limit: 512m
    mem_reservation: 256m
    memswap_limit: 1g
    pids_limit: 200
    shm_size: 64m
    oom_kill_disable: false
    oom_score_adj: -500
    ulimits:
      nofile: 65536            # scalar form: soft == hard
      nproc:                   # object form
        soft: 1024
        hard: 2048

  gpu-worker:
    image: alpine:latest
    command: ["sh", "-c", "echo gpu worker && sleep infinity"]
    gpus: all                  # shorthand
    blkio_config:
      weight: 300
      weight_device:
        - path: /dev/sda
          weight: 400

  numa-pinned:
    image: alpine:latest
    command: ["sh", "-c", "sleep infinity"]
    gpus:
      - driver: nvidia
        count: 2
        capabilities: [compute, utility]
        device_ids: ["0", "1"]
