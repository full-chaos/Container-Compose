name: Tests

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'Sources/**'
      - 'Tests/**'
      - 'Resources/openapi.yaml'
      - 'Package.swift'
      - 'Package.resolved'
      - '.github/workflows/tests.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'Sources/**'
      - 'Tests/**'
      - 'Resources/openapi.yaml'
      - 'Package.swift'
      - 'Package.resolved'
      - '.github/workflows/tests.yml'
  # Merge queue evaluates required status checks against a synthetic
  # merge-group commit. Without this trigger the queue blocks forever
  # waiting for `Build and Test` to report.
  merge_group:

# Cancel stale runs on the same ref so superseded commits don't burn CI time.
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Two suites run on parallel macOS runners so a slow or flaky dynamic
  # suite cannot pin the wall-clock time for fast static feedback.
  #
  # - Static (`Container-Compose-StaticTests`): pure, deterministic, uses
  #   RecordingRuntime / MockRuntime. Runs with --parallel for speed.
  # - Dynamic (`Container-Compose-DynamicTests`): integration tests against
  #   a real apple/container daemon. CI runners do not ship apple/container,
  #   so dynamic suites apply `.enabled(if: RuntimeAvailability.isAvailable())`
  #   and skip cleanly here. We still build them to catch compile errors.
  #   Run sequentially (no --parallel) to avoid daemon contention on machines
  #   that DO have apple/container installed.
  test:
    name: ${{ matrix.suite }} Tests
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: Static
            target: Container_Compose_StaticTests
            extra_args: "--parallel"
            # Silent-skip guard (CHAOS-1507 follow-up). Swift 6.3.1 normalizes
            # target-name dashes to underscores in the filter grammar; a typo or
            # regression to the dashed form `Container-Compose-StaticTests`
            # silently matches zero tests and exits 0. Fail loudly if fewer
            # than `min_tests` ran. Floor chosen well below the current 1806
            # so additions/removals don't trigger noise.
            min_tests: 1500
          - suite: Dynamic
            target: Container_Compose_DynamicTests
            extra_args: ""
            # CI runners do not ship apple/container, so every dynamic test
            # self-skips via `.enabled(if: RuntimeAvailability.isAvailable())`.
            # Swift Testing reports the run as `0 tests`. No floor is
            # enforceable here; we still build the target to catch compile drift.
            min_tests: 0

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    # SwiftyLab/setup-swift is the Node-24 successor to swift-actions/setup-swift
    # (whose v3 still ships `using: node20`). Same `swift-version` input, drop-in
    # replacement. Bump alongside Package.swift's swift-tools-version.
    - name: Setup Swift
      uses: SwiftyLab/setup-swift@v1
      with:
        swift-version: "6.3.1"

    # Cache only the SwiftPM dependency download cache, not `.build`.
    # `.build` contains clang module-cache `.pcm` files with embedded
    # absolute paths; restoring them into a workspace whose path-case
    # differs from the build-time path triggers
    # `module '_DarwinFoundation2' is defined in both …` from clang.
    - name: Cache SwiftPM dependencies
      uses: actions/cache@v5
      with:
        path: ~/Library/Caches/org.swift.swiftpm
        key: ${{ runner.os }}-swiftpm-deps-${{ hashFiles('Package.resolved') }}
        restore-keys: |
          ${{ runner.os }}-swiftpm-deps-

    - name: Build tests
      run: swift build --build-tests

    - name: Run ${{ matrix.suite }} tests
      shell: bash
      run: |
        set -o pipefail
        log_file="test-output-${{ matrix.suite }}.log"
        swift test --filter "${{ matrix.target }}" ${{ matrix.extra_args }} 2>&1 | tee "$log_file"
        test_exit=${PIPESTATUS[0]}
        # Swift Testing prints e.g. `Test run with 1806 tests in 151 suites passed`.
        # XCTest prints e.g. `Executed N tests`. Capture either form.
        count=$(grep -oE 'Test run with [0-9]+ tests|Executed [0-9]+ tests' "$log_file" | grep -oE '[0-9]+' | tail -1 || true)
        count=${count:-0}
        echo "::notice::Suite ${{ matrix.suite }} executed $count tests (min ${{ matrix.min_tests }})"
        if [ "$count" -lt "${{ matrix.min_tests }}" ]; then
          echo "::error::Filter '${{ matrix.target }}' executed $count tests (expected >= ${{ matrix.min_tests }}). Did the Swift Testing target-name normalization change, or did the filter typo into a zero-match form?"
          exit 2
        fi
        exit $test_exit

    - name: Upload test artifacts on failure
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: test-results-${{ matrix.suite }}
        path: .build/debug/*.xctest
        if-no-files-found: ignore
