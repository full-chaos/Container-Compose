name: Tests

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'Sources/**'
      - 'Tests/**'
      - 'Package.swift'
      - 'Package.resolved'
      - '.github/workflows/tests.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'Sources/**'
      - 'Tests/**'
      - 'Package.swift'
      - 'Package.resolved'
      - '.github/workflows/tests.yml'
  # Merge queue evaluates required status checks against a synthetic
  # merge-group commit. Without this trigger the queue blocks forever
  # waiting for `Build and Test` to report.
  merge_group:

# Cancel stale runs on the same ref so superseded commits don't burn CI time.
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Opt JavaScript actions into Node 24 ahead of GitHub's June 2026 forced
# migration. Silences the deprecation warning from actions/cache@v4,
# actions/checkout@v4, swift-actions/setup-swift@v3, etc.
# https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  test:
    name: Build and Test
    runs-on: macos-26

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # Pin Swift to the version that swift-actions/setup-swift@v3's `latest`
    # currently resolves to anyway, so the "requested: latest, actual: 6.3.1"
    # warning goes away. Bump alongside Package.swift's swift-tools-version.
    - name: Setup Swift
      uses: swift-actions/setup-swift@v3
      with:
        swift-version: "6.3.1"

    # CI runners do not ship Apple `container`. Dynamic suites apply
    # .enabled(if: RuntimeAvailability.isAvailable()), so they skip cleanly here
    # — no --filter / --skip needed. See Tests/TestHelpers/RuntimeAvailability.swift.

    # Cache only the SwiftPM dependency download cache, not `.build`.
    # `.build` contains clang module-cache `.pcm` files with embedded
    # absolute paths; restoring them into a workspace whose path-case
    # differs from the build-time path triggers
    # `module '_DarwinFoundation2' is defined in both …` from clang.
    - name: Cache SwiftPM dependencies
      uses: actions/cache@v4
      with:
        path: ~/Library/Caches/org.swift.swiftpm
        key: ${{ runner.os }}-swiftpm-deps-${{ hashFiles('Package.resolved') }}
        restore-keys: |
          ${{ runner.os }}-swiftpm-deps-

    - name: Build tests
      run: swift build --build-tests

    - name: Run tests
      # TODO(CHAOS-1314): revert --no-parallel once upstream Swift Testing fixes
      # swiftpm-testing-helper SIGBUS during post-pass teardown on macOS CI.
      run: swift test --no-parallel

    - name: Upload test artifacts on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: .build/debug/*.xctest
        if-no-files-found: ignore
