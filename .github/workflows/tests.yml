name: Tests

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'Sources/**'
      - 'Tests/**'
      - 'Package.swift'
      - 'Package.resolved'
      - '.github/workflows/tests.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'Sources/**'
      - 'Tests/**'
      - 'Package.swift'
      - 'Package.resolved'
      - '.github/workflows/tests.yml'
  # Merge queue evaluates required status checks against a synthetic
  # merge-group commit. Without this trigger the queue blocks forever
  # waiting for `Build and Test` to report.
  merge_group:

# Cancel stale runs on the same ref so superseded commits don't burn CI time.
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Two suites run on parallel macOS runners so a slow or flaky dynamic
  # suite cannot pin the wall-clock time for fast static feedback.
  #
  # - Static (`Container-Compose-StaticTests`): pure, deterministic, uses
  #   RecordingRuntime / MockRuntime. Runs with --parallel for speed.
  # - Dynamic (`Container-Compose-DynamicTests`): integration tests against
  #   a real apple/container daemon. CI runners do not ship apple/container,
  #   so dynamic suites apply `.enabled(if: RuntimeAvailability.isAvailable())`
  #   and skip cleanly here. We still build them to catch compile errors.
  #   Run sequentially (no --parallel) to avoid daemon contention on machines
  #   that DO have apple/container installed.
  test:
    name: ${{ matrix.suite }} Tests
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: Static
            target: Container-Compose-StaticTests
            extra_args: "--parallel"
          - suite: Dynamic
            target: Container-Compose-DynamicTests
            extra_args: ""

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    # SwiftyLab/setup-swift is the Node-24 successor to swift-actions/setup-swift
    # (whose v3 still ships `using: node20`). Same `swift-version` input, drop-in
    # replacement. Bump alongside Package.swift's swift-tools-version.
    - name: Setup Swift
      uses: SwiftyLab/setup-swift@v1
      with:
        swift-version: "6.3.1"

    # Cache only the SwiftPM dependency download cache, not `.build`.
    # `.build` contains clang module-cache `.pcm` files with embedded
    # absolute paths; restoring them into a workspace whose path-case
    # differs from the build-time path triggers
    # `module '_DarwinFoundation2' is defined in both …` from clang.
    - name: Cache SwiftPM dependencies
      uses: actions/cache@v5
      with:
        path: ~/Library/Caches/org.swift.swiftpm
        key: ${{ runner.os }}-swiftpm-deps-${{ hashFiles('Package.resolved') }}
        restore-keys: |
          ${{ runner.os }}-swiftpm-deps-

    - name: Build tests
      run: swift build --build-tests

    - name: Run ${{ matrix.suite }} tests
      run: swift test --filter "${{ matrix.target }}" ${{ matrix.extra_args }}

    - name: Upload test artifacts on failure
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: test-results-${{ matrix.suite }}
        path: .build/debug/*.xctest
        if-no-files-found: ignore
