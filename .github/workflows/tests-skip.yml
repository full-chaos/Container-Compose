name: Tests

# Sibling of tests.yml. tests.yml's `paths:` filter skips runs entirely
# when a PR touches no buildable code, which means it reports no
# `Build and Test` status check at all — a required check then waits
# forever for a report that never arrives. This file's `paths-ignore:`
# is the complement of tests.yml's `paths:`, so one of the two always
# fires and `Build and Test` always reports. Keep these path lists
# mirrored.
on:
  pull_request:
    branches: [ main ]
    paths-ignore:
      - 'Sources/**'
      - 'Tests/**'
      - 'Package.swift'
      - 'Package.resolved'
      - '.github/workflows/tests.yml'

permissions: {}

# Both files share `name: Tests` so the produced check has the same
# identity (`Tests / Build and Test`) and either satisfies a required
# check entry. Use a file-specific concurrency group so a mixed-change
# PR (code + docs) doesn't have the two workflows cancel each other.
concurrency:
  group: tests-skip-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - name: Report success for non-buildable change
        run: echo "No buildable code changed; reporting Build and Test as success."
