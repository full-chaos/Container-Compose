name: Tests

# Sibling of tests.yml. tests.yml's `paths:` filter skips runs entirely
# when a PR touches no buildable code, which means it reports no
# `Build and Test` status check at all — a required check then waits
# forever for a report that never arrives. This file's `paths-ignore:`
# is the complement of tests.yml's `paths:`, so one of the two always
# fires and `Build and Test` always reports. Keep these path lists
# mirrored.
on:
  pull_request:
    branches: [ main ]
    paths-ignore:
      - 'Sources/**'
      - 'Tests/**'
      - 'Package.swift'
      - 'Package.resolved'
      - '.github/workflows/tests.yml'

permissions: {}

# Both files share `name: Tests` so the produced checks share the same
# workflow identity. The matrix here mirrors tests.yml's matrix so the
# check names match exactly:
#   - `Tests / Static Tests`
#   - `Tests / Dynamic Tests`
# Either workflow's matrix entry satisfies the corresponding required check.
# Use a file-specific concurrency group so a mixed-change PR (code + docs)
# doesn't have the two workflows cancel each other.
concurrency:
  group: tests-skip-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.suite }} Tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite: [ Static, Dynamic ]
    steps:
      - name: Report success for non-buildable change
        run: echo "No buildable code changed; reporting ${{ matrix.suite }} Tests as success."
